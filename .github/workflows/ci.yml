name: CI Testbed Qualification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools, clang, and libbpf
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm libelf-dev libbpf-dev zlib1g-dev gcc-multilib

      - name: Build C testbed and BPF object
        run: |
          make clean
          make all

      - name: Execute automated qualification scenarios with kernel BPF privileges
        run: |
          chmod +x run_tests.sh
          sudo ./run_tests.sh
